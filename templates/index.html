<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>Caixa Ponto X</title>
</head>

<body class="pai">

    <header class="cima">
        <div class="identidade">
            <h1 class="titulo_header">PONTO X</h1>
            <p>Caixa de vendas</p>
        </div>

        <a class="link-gestao" href="{{ url_for('gestao') }}">
            Gerenciar produtos
        </a>
    </header>

    <main class="centro">
        
        <section class="esquerda" id="area-produtos">

            <nav class="produtos" aria-label="Categorias de produtos">

                <h2>Categorias</h2>

                <button type="button"
                        class="escolha ativo"
                        id="categoria-bebidas">
                    Bebidas
                </button>

                <button type="button"
                        class="escolha"
                        id="categoria-doces">
                    Doces e alimentos
                </button>

                <button type="button"
                        class="escolha"
                        id="categoria-limpeza">
                    Limpeza
                </button>

                <button type="button"
                        class="escolha"
                        id="categoria-outros">
                    Outros
                </button>

            </nav>

            <section class="catalogo">

                <div class="titulo-catalogo">
                    <h2>Mercadorias</h2>
                    <p>Selecione um produto para adicionar ao carrinho.</p>
                </div>

                <div class="lista-produtos" id="lista-produtos">

                    <div class="mensagem-vazia">
                        <p>Selecione uma categoria para visualizar os produtos.</p>
                    </div>

                </div>

            </section>

        </section>

        <aside class="direita" id="area-carrinho">

            <div class="cabecalho-carrinho">
                <h2>Carrinho</h2>
                <span class="contador-carrinho" id="contador-carrinho">
                    0 itens
                </span>
            </div>

            <ul class="carrinho" id="lista-carrinho">

                <li class="carrinho-vazio">
                    Seu carrinho está vazio.
                </li>

            </ul>

            <div class="resumo-compra">

                <div class="linha-total">
                    <span>Total</span>
                    <strong id="total-carrinho">R$ 0,00</strong>
                </div>

                <button type="button"
                        class="finish"
                        id="finalizar-compra">
                    Finalizar compra
                </button>

            </div>

        </aside>

    </main>

    <script
        src="{{ url_for('static', filename='js/caixa.js') }}"
        defer>
    </script>

</body>
</html>
